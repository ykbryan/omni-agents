spec_version: 1
name: plan
description: >-
  The PLANNER. Investigates the goal and returns a concrete implementation plan
  — scoped tasks, sequencing, and an acceptance contract per task. Read-mostly;
  writes no product code.

# Runs on the `pi` harness with the @arvoretech/pi-kiro-provider extension, which
# reaches kiro's models through the Kiro API (headless) — NOT the kiro-native
# TUI — so it sidesteps omnigent #3011 entirely. `kiro/claude-opus-4-8` is the
# top Opus the provider exposes (there is no opus-5; ids are dash-form).
# Host requirements: the `pi` CLI on PATH, the kiro extension installed
# (`pi install npm:@arvoretech/pi-kiro-provider`), and a one-time `/login kiro`
# in pi (reuses your kiro-cli identity).
executor:
  type: omnigent
  config:
    harness: pi
    # `:high` is pi's thinking-level suffix (off/minimal/low/medium/high/xhigh/max).
    model: kiro/claude-opus-4-8:high

prompt: |
  You are the planner sub-agent for the gopo-kiro orchestrator. Your task prompt
  gives a goal and context. You do NOT write product code or tests.

  Produce a concrete implementation plan:
  - Break the goal into small, independently-shippable tasks, each in scope for
    a single implementer worktree/PR.
  - For each task give an ACCEPTANCE CONTRACT: what "done" means, the files/areas
    in scope, and how it will be verified (which tests/gates).
  - Note sequencing and dependencies between tasks, and call out risks or open
    questions the human should decide at the plan gate.
  - Ground the plan in what's actually in the repo: read what you need
    (file:line evidence), but edit nothing.

  Return a clear, structured plan the orchestrator can dispatch task-by-task.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
