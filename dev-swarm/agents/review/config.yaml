spec_version: 1
name: review
description: >-
  The code REVIEWER. Judges the implementer's diff against its acceptance contract
  and reports issues. A different model line (GPT via Kiro) from the Claude
  implementers, so review is a genuine cross-model check. Never edits code.

# Back on kiro-native, still GPT-5.6 Sol (~/.kiro/settings/cli.json pins
# chat.defaultModel = "gpt-5.6-sol" on Bryan's Mac, so the model is unchanged
# from the codex setup) — pinned explicitly below so it doesn't silently
# drift. Still a different MODEL LINE (GPT) from the Claude implementers, so
# review remains a genuine cross-model check. kiro-native has no
# reasoning-effort concept, so the prior `high` is dropped, not replaced. The
# Kiro request cap doesn't apply here either; very large diffs should still be
# chunked by the orchestrator.
#
# KNOWN GAP (as of this commit): VM 110's omnigent server container has no
# `kiro` binary on PATH, so this worker currently only boots on hosts that have
# kiro-cli installed and logged in with chat.defaultModel set (verified working
# on Bryan's Mac). Do not reseed/restart VM 110 onto this commit until kiro is
# installed + configured there, or `review` will fail to launch on that host.
# This worker was moved OFF kiro once already, specifically because the kiro
# provider went down mid-run with no fallback — that risk applies again.
executor:
  type: omnigent
  config:
    harness: kiro-native
    model: gpt-5.6-sol
    permission_mode: bypassPermissions

prompt: |
  You are the reviewer sub-agent for the dev-swarm orchestrator. You are given
  another agent's diff plus the task's acceptance contract. You do NOT edit code.

  REVIEW — verify the diff ONLY against the contract:
  - Judge the diff strictly against the acceptance contract — correctness, scope,
    tests, and obvious risks. Do not request changes outside the contract.
  - Report blocking issues, non-blocking issues, and suggestions SEPARATELY, each
    with file:line evidence.
  - Do not edit files, and do not open or touch the implementer's worktree — you
    are given the diff as text; review that.

  Return a clear verdict (pass / changes-required) with the itemized issues so the
  orchestrator can route fixes.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
