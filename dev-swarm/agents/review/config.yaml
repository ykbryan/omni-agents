spec_version: 1
name: review
description: >-
  The code REVIEWER. Judges the implementer's diff against its acceptance contract
  and reports issues. A different model line (GPT via Kiro) from the Claude
  implementers, so review is a genuine cross-model check. Never edits code.

# Moved OFF kiro-native onto `pi` harness talking to Kiro through the
# `@arvoretech/pi-kiro-provider` extension (npm:@arvoretech/pi-kiro-provider,
# a maintained fork of mikeyobrien/pi-provider-kiro). Same underlying model
# (gpt-5.6-sol) and provider (Kiro/AWS CodeWhisperer) as the old kiro-native
# setup — still a different MODEL LINE (GPT) from the Claude implementers, so
# review remains a genuine cross-model check. `pi` is a plain CLI_SUBPROCESS
# harness Omnigent can run on ANY host with `pi` on PATH — unlike kiro-native,
# which needed a real terminal on a machine with kiro-cli installed (Mac-only;
# VM 110's server container had no `kiro` binary on PATH at all). This fixes
# that gap: `pi` + this extension is verified working on VM 110 (logged in
# via `/login kiro`, reusing the host's kiro-cli OAuth session where
# possible).
#
# Effort: `pi --model` accepts an optional `:<thinking>` suffix
# (`provider/id:level`, e.g. Pi's own `pi --model sonnet:high` example), so
# `high` is baked directly into the `model:` string below at launch — no
# priming-message workaround needed (unlike kiro-native, which had no
# effort-passthrough at all and required the orchestrator to send a
# standalone `/effort high` message; see dev-swarm/config.yaml history).
#
# Setup required on any host that runs this worker: `pi install
# npm:@arvoretech/pi-kiro-provider` + `/login kiro` once (or let it reuse an
# existing kiro-cli session). As of this commit: done on VM 110. NOT yet done
# on Bryan's Mac — plan/review will fail to launch there until the Mac also
# runs `/login kiro` in an interactive `pi` session (this is an OAuth login
# step, so it has to be done by hand, not scripted).
#
# This worker was moved OFF kiro-native once before too, specifically because
# the kiro provider went down mid-run with no fallback — that single-point-
# of-failure risk still applies; the orchestrator's 3-strike review limit is
# the safety net if it recurs.
executor:
  type: omnigent
  config:
    harness: pi
    model: kiro/gpt-5.6-sol:high
    permission_mode: bypassPermissions

prompt: |
  You are the reviewer sub-agent for the dev-swarm orchestrator. You are given
  another agent's diff plus the task's acceptance contract. You do NOT edit code.

  REVIEW — verify the diff ONLY against the contract:
  - Judge the diff strictly against the acceptance contract — correctness, scope,
    tests, and obvious risks. Do not request changes outside the contract.
  - Report blocking issues, non-blocking issues, and suggestions SEPARATELY, each
    with file:line evidence.
  - Do not edit files, and do not open or touch the implementer's worktree — you
    are given the diff as text; review that.

  Return a clear verdict (pass / changes-required) with the itemized issues so the
  orchestrator can route fixes.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
