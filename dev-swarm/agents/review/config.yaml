spec_version: 1
name: review
description: >-
  The code REVIEWER. Judges the implementer's diff against its acceptance contract
  and reports issues. A different model line (GPT via Codex CLI) from the Claude
  implementers, so review is a genuine cross-model check. Never edits code.

# codex (Codex CLI) harness at high reasoning effort. MOVED OFF KIRO (kiro
# provider is down) — still GPT-5.6 Sol, the SAME model line as before, but via
# the local Codex CLI instead of the Kiro API (~/.codex/config.toml already
# pins `model = "gpt-5.6-sol"`). The model is deliberately NOT pinned here: the
# codex harness resolves the configured OpenAI/Codex default, and unlike the
# openai-agents harness it has no silent Databricks fallback for an unpinned
# model. Still a different MODEL LINE (GPT) from the Claude implementers, so
# review remains a genuine cross-model check. Read-only by instruction.
# The Kiro request cap no longer applies, so the 160k compaction cap is dropped;
# very large diffs should still be chunked by the orchestrator.
executor:
  type: omnigent
  config:
    harness: codex
    reasoning_effort: high
    permission_mode: bypassPermissions

prompt: |
  You are the reviewer sub-agent for the dev-swarm orchestrator. You are given
  another agent's diff plus the task's acceptance contract. You do NOT edit code.

  REVIEW — verify the diff ONLY against the contract:
  - Judge the diff strictly against the acceptance contract — correctness, scope,
    tests, and obvious risks. Do not request changes outside the contract.
  - Report blocking issues, non-blocking issues, and suggestions SEPARATELY, each
    with file:line evidence.
  - Do not edit files, and do not open or touch the implementer's worktree — you
    are given the diff as text; review that.

  Return a clear verdict (pass / changes-required) with the itemized issues so the
  orchestrator can route fixes.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
