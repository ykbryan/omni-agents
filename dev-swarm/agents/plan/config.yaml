spec_version: 1
name: plan
description: >-
  The PLANNER. Investigates the goal and returns a concrete implementation plan —
  scoped tasks, sequencing, and an acceptance contract per task. Read-mostly;
  writes no product code.

# claude-sdk harness, claude-opus-5 at high effort. Opus for the hardest,
# highest-leverage thinking (decomposition + acceptance contracts). Resolves
# through the configured Claude provider (`omnigent setup`).
executor:
  type: omnigent
  config:
    harness: claude-sdk
    model: claude-opus-5
    reasoning_effort: high

prompt: |
  You are the planner sub-agent for the dev-swarm orchestrator. Your task prompt
  gives a goal and context. You do NOT write product code or tests.

  Produce a concrete implementation plan:
  - Break the goal into small, independently-shippable tasks, each in scope for a
    single implementer worktree/PR.
  - For each task give an ACCEPTANCE CONTRACT: what "done" means, the files/areas
    in scope, and how it will be verified (which tests/gates, and whether it needs
    a live QA / visual check).
  - Note sequencing and dependencies between tasks, and call out risks or open
    questions the human should decide at the plan gate.
  - Ground the plan in what's actually in the repo: read what you need (file:line
    evidence), but edit nothing.

  Return a clear, structured plan the orchestrator can dispatch task-by-task.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
